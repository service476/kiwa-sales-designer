// ── Load a saved client ──
function loadClient(name){
  try {
    const saved = JSON.parse(localStorage.getItem(LS_PREFIX + name));
    if(saved && saved.screens && saved.screens.length){
      migrateState(saved);
      Object.assign(state, saved);
      state.showAll = false;
      if(!state.screens.find(s=>s.id===state.currentId)) state.currentId = state.screens[0].id;
      if(!state.checklist) state.checklist = JSON.parse(JSON.stringify(DEFAULT_CHECKLIST));
      updateClientBadge();
      renderScreenList();
      renderChecklist();
      selectScreen(state.currentId);
      updateChecklistProgress();
      closeClientModal();
    }
  } catch(e){ console.error('loadClient failed', e); }
}

// ── Create new client from empty template ──
function newClient(name, product){
  const tpl = makeEmptyTemplate(name, product);
  migrateState(tpl);
  Object.assign(state, tpl);
  _doSave();
  updateClientBadge();
  renderScreenList();
  renderChecklist();
  selectScreen(state.currentId);
  updateChecklistProgress();
  closeClientModal();
  // 新客戶直接跳 Brief 填策略
  setTimeout(()=>switchNavTab('brief'), 50);
}

// ── Delete a saved client ──
function deleteClient(name){
  localStorage.removeItem(LS_PREFIX + name);
  const remaining = getClientIndex().filter(c=>c.name!==name);
  localStorage.setItem(LS_INDEX_KEY, JSON.stringify(remaining));
  if(state.client === name && remaining.length){
    loadClient(remaining.slice().sort((a,b)=>b.lastModified-a.lastModified)[0].name);
    return;
  }
  renderClientModal();
}

// ── Import JSON draft ──
function importJSON(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.screens && data.client){
          migrateState(data);
          Object.assign(state, data);
          state.showAll = false;
          if(!state.screens.find(s=>s.id===state.currentId)) state.currentId = state.screens[0].id;
          if(!state.checklist) state.checklist = JSON.parse(JSON.stringify(DEFAULT_CHECKLIST));
          _doSave();
          updateClientBadge();
          renderScreenList();
          renderChecklist();
          selectScreen(state.currentId);
          updateChecklistProgress();
        } else { alert('無效的草稿格式'); }
      } catch(e){ alert('檔案解析失敗'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ── Modal controls ──
function openClientModal(){
  renderClientModal();
  document.getElementById('clientModal').style.display = 'flex';
}
function closeClientModal(){
  const m = document.getElementById('clientModal');
  if(m) m.style.display = 'none';
  // reset to list view
  const lv = document.getElementById('clientListView');
  const nf = document.getElementById('newClientForm');
  const ft = document.getElementById('clientModalFooter');
  if(lv) lv.style.display = 'block';
  if(nf) nf.style.display = 'none';
  if(ft) ft.style.display = 'block';
}
function showNewClientForm(){
  document.getElementById('clientListView').style.display = 'none';
  document.getElementById('newClientForm').style.display = 'block';
  document.getElementById('clientModalFooter').style.display = 'none';
  setTimeout(()=>document.getElementById('ncClientName')?.focus(), 50);
}
function cancelNewClient(){
  document.getElementById('newClientForm').style.display = 'none';
  document.getElementById('clientListView').style.display = 'block';
  document.getElementById('clientModalFooter').style.display = 'block';
}
function confirmNewClient(){
  const nameInput = document.getElementById('ncClientName');
  const name = nameInput.value.trim();
  const product = document.getElementById('ncProduct').value.trim();
  if(!name){ nameInput.style.borderColor = 'var(--red)'; nameInput.focus(); return; }
  nameInput.style.borderColor = '';
  newClient(name, product);
}
function renderClientModal(){
  const list = document.getElementById('clientList');
  if(!list) return;
  const index = getClientIndex().slice().sort((a,b)=>b.lastModified-a.lastModified);
  if(!index.length){
    list.innerHTML = '<div style="text-align:center;padding:24px 0;color:var(--text-3);font-size:13px">尚無儲存的客戶草稿</div>';
    return;
  }
  list.innerHTML = index.map(c=>{
    const active = c.name === state.client;
    const d = new Date(c.lastModified);
    const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `<div class="client-item${active?' active':''}" onclick="loadClient('${esc(c.name)}')">
      <div class="client-info">
        <div class="client-name">${esc(c.name)}${c.product ? ` <span style="font-weight:400;color:var(--text-2);font-size:12px">— ${esc(c.product)}</span>` : ''}</div>
        <div class="client-meta">${c.screenCount} 個分屏 · ${dateStr}</div>
      </div>
      <button class="client-delete" onclick="event.stopPropagation();deleteClient('${esc(c.name)}')" title="刪除草稿">✕</button>
    </div>`;
  }).join('');
}

// ── Start ──
init();
</script>
